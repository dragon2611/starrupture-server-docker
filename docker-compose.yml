---
services:
  starrupture:
    #image: indifferentbroccoli/starrupture-server-docker
    build: .
    platform: linux/amd64
    restart: unless-stopped
    container_name: starrupture
    stop_grace_period: 30s
    ports:
      - 7777:7777/udp
      - 7777:7777/tcp
    env_file:
      - .env.example
    volumes:
      - ./server-files:/home/steam/server-files
    security_opt:
    #Dockers CopyFail Mitigations break steamcmd, this is a horrible way to handle it but since this repo is used on a dedicated VM i'm less worried about doing this than I otherwise would be.
      - seccomp=unconfined
